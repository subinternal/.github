<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="An example run of mttr in a terminal: the skills are added, mttr reads 100 pages and ranks 14 fixes, three fixes land, mttr reads the site again, and the score goes from 61 to 88.">
<title>An example run of mttr on a made-up site</title>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff4f9f"/><stop offset=".55" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffc233"/></linearGradient></defs>
<style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:17px}.l{opacity:0}@keyframes l0{0%,100%{opacity:1}}.l0{animation:l0 16.0s ease-out infinite}@keyframes l1{0%,100%{opacity:1}}.l1{animation:l1 16.0s ease-out infinite}@keyframes l2{0%,7.50%{opacity:0;transform:translateY(6px)}10.00%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l2{animation:l2 16.0s ease-out infinite}@keyframes l3{0%,16.25%{opacity:0;transform:translateY(6px)}18.75%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l3{animation:l3 16.0s ease-out infinite}@keyframes l4{0%,23.75%{opacity:0;transform:translateY(6px)}26.25%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l4{animation:l4 16.0s ease-out infinite}@keyframes l5{0%,28.75%{opacity:0;transform:translateY(6px)}31.25%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l5{animation:l5 16.0s ease-out infinite}@keyframes l6{0%,33.75%{opacity:0;transform:translateY(6px)}36.25%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l6{animation:l6 16.0s ease-out infinite}@keyframes l7{0%,41.25%{opacity:0;transform:translateY(6px)}43.75%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.l7{animation:l7 16.0s ease-out infinite}@keyframes f0{0%,25.62%{opacity:0;transform:translateY(6px)}28.12%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.f0{animation:f0 16.0s ease-out infinite}@keyframes f1{0%,30.62%{opacity:0;transform:translateY(6px)}33.12%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.f1{animation:f1 16.0s ease-out infinite}@keyframes f2{0%,35.62%{opacity:0;transform:translateY(6px)}38.12%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.f2{animation:f2 16.0s ease-out infinite}@keyframes sc{0%,46.25%{opacity:0;transform:translateY(6px)}48.75%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.sc{animation:sc 16.0s ease-out infinite}@keyframes grow{0%,46.25%{width:220px}54.25%,94%{width:317px}100%{width:220px}}.bar{animation:grow 16.0s cubic-bezier(.2,.8,.2,1) infinite}@keyframes old{0%,46.25%{opacity:1}49.25%,100%{opacity:0}}@keyframes new{0%,46.25%{opacity:0}49.25%,94%{opacity:1}98%,100%{opacity:0}}.old{animation:old 16.0s ease-out infinite}.new{animation:new 16.0s ease-out infinite}@media (prefers-reduced-motion: reduce){.l,.bar,.old,.new{animation:none!important;opacity:1}.old{opacity:0}}</style>
<rect x="1" y="1" width="958" height="468" rx="18" fill="#ffffff" stroke="#e3e1dc"/>
<line x1="1" y1="78" x2="959" y2="78" stroke="#e3e1dc"/>
<circle cx="56" cy="51" r="6" fill="#e3e1dc"/><circle cx="76" cy="51" r="6" fill="#e3e1dc"/><circle cx="96" cy="51" r="6" fill="#e3e1dc"/>
<text x="480.0" y="56" text-anchor="middle" fill="#6b6e75" font-size="14">claude  ~/your-site</text>
<text class="l l0" x="56" y="132" xml:space="preserve"><tspan fill="#a3a6ad" font-weight="400">$ </tspan><tspan fill="#16171a" font-weight="500">npx skills add subinternal/mttr</tspan></text>
<text class="l l1" x="56" y="166" xml:space="preserve"><tspan fill="#6b6e75" font-weight="400">  added 6 skills to .claude/skills</tspan></text>
<text class="l l2" x="56" y="200" xml:space="preserve"><tspan fill="#c8326a" font-weight="600">&gt; </tspan><tspan fill="#16171a" font-weight="500">Check yoursite.com with mttr and fix what’s worth the most.</tspan></text>
<text class="l l3" x="56" y="234" xml:space="preserve"><tspan fill="#c8326a" font-weight="600">  mttr  </tspan><tspan fill="#6b6e75" font-weight="400">read 100 pages, ranked 14 fixes by worth</tspan></text>
<text class="l l4" x="56" y="268" xml:space="preserve"><tspan fill="#1f8a5b" font-weight="600">  ✓ </tspan><tspan fill="#16171a" font-weight="400">Text in the HTML, 12 pages</tspan></text>
<text class="l l5" x="56" y="302" xml:space="preserve"><tspan fill="#1f8a5b" font-weight="600">  ✓ </tspan><tspan fill="#16171a" font-weight="400">One main heading, 31 pages</tspan></text>
<text class="l l6" x="56" y="336" xml:space="preserve"><tspan fill="#1f8a5b" font-weight="600">  ✓ </tspan><tspan fill="#16171a" font-weight="400">Structured data, 18 pages</tspan></text>
<text class="l l7" x="56" y="370" xml:space="preserve"><tspan fill="#c8326a" font-weight="600">  mttr  </tspan><tspan fill="#6b6e75" font-weight="400">read it again</tspan></text>
<text class="l f0" x="904" y="268" text-anchor="end" fill="#1f8a5b" font-weight="600">+9</text>
<text class="l f1" x="904" y="302" text-anchor="end" fill="#1f8a5b" font-weight="600">+6</text>
<text class="l f2" x="904" y="336" text-anchor="end" fill="#1f8a5b" font-weight="600">+4</text>
<g class="l sc"><text x="56" y="418" fill="#6b6e75">  score</text><rect x="206" y="405" width="360" height="14" rx="7" fill="#e9e7e2"/><rect class="bar" x="206" y="405" width="220" height="14" rx="7" fill="url(#g)"/><text class="old" x="588" y="418" fill="#16171a" font-weight="700" font-size="20">61</text><text class="new" x="588" y="418" fill="#16171a" font-weight="700" font-size="20">88</text></g>
<text x="928" y="448" text-anchor="end" fill="#a3a6ad" font-size="13">An example run on a made-up site.</text>
</svg>
